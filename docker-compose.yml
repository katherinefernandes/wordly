services:
  postgres:
    image: postgres:17
    container_name: wordly-postgres


    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      # HOST:CONTAINER
      #
      # PostgreSQL listens on port 5432 inside the container.
      # We expose it as port 5432 on your machine.
      - "5432:5432"

    volumes:
      # Store PostgreSQL data outside the container itself.
      #
      # This means deleting/recreating the container does NOT
      # automatically delete our database.
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
